[package]
name = "eventline"
version = "0.9.0"
edition = "2024"
authors = ["Dustin Pilgrim <dustin.pilgrim1997@gmail.com>"]
description = "Structured journaling and scoped logging for Rust applications."
license = "MIT"
repository = "https://github.com/saltnpepper97/eventline"
readme = "README.md"
keywords = ["logging", "journal", "tracing", "scopes", "debugging"]
categories = ["development-tools::debugging", "development-tools::profiling"]
rust-version = "1.89"

[dependencies]
parking_lot = "0.12.5"
log = { version = "0.4.28", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.47", features = ["formatting", "local-offset"] }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.22", optional = true }

[features]
default = []
log = ["dep:log"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
